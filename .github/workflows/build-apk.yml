name: Build and Sign Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    env:
      ACTIONS_RUNNER_FORCE_NODE24: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Environment
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'soe_release_2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'soe_release_key' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'soe_release_2026' }}
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/SOE-release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding KEYSTORE_BASE64 from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          else
            echo "No KEYSTORE_BASE64 provided. Generating release signing keystore..."
            keytool -genkey -v -keystore "$KEYSTORE_FILE" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=SOE School Visit, OU=Mission Gyan, O=SOE, L=Jaipur, ST=Rajasthan, C=IN"
          fi
          chmod 600 "$KEYSTORE_FILE"
          echo "Keystore successfully prepared at $KEYSTORE_FILE"

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/SOE-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'soe_release_2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'soe_release_key' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'soe_release_2026' }}
        run: |
          GRADLE_CMD="./gradlew"
          if [ ! -f "./gradlew" ]; then
            GRADLE_CMD="gradle"
          fi
          echo "Running Gradle build command: $GRADLE_CMD :app:assembleRelease"
          $GRADLE_CMD :app:assembleRelease --stacktrace --no-daemon -Dorg.gradle.configuration-cache=false -Dksp.incremental=false

      - name: Verify APK Signature
        run: |
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$RELEASE_APK" ] || [ ! -f "$RELEASE_APK" ]; then
            echo "Release APK search in app/build/outputs/apk/release..."
            ls -la app/build/outputs/apk/release/ || true
            RELEASE_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          
          if [ -z "$RELEASE_APK" ] || [ ! -f "$RELEASE_APK" ]; then
            echo "ERROR: No APK found after build!"
            exit 1
          fi
          
          echo "Found APK: $RELEASE_APK"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            echo "Verifying APK with $APKSIGNER..."
            $APKSIGNER verify --verbose "$RELEASE_APK" || true
          fi

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SOE-release-signed-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Setup Node.js 22 for Firebase Functions
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'

      - name: Install Functions Dependencies
        run: |
          npm --prefix functions ci

      - name: Deploy Firebase Cloud Functions (uploadPhotoToDrive)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOE_VISIT_TEST || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Deploying uploadPhotoToDrive using Service Account Key..."
            echo "$FIREBASE_SERVICE_ACCOUNT" > "$HOME/gcp-sa-key.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$HOME/gcp-sa-key.json"
            npx firebase-tools deploy --only functions:uploadPhotoToDrive --project soe-visit-test --non-interactive
            rm -f "$HOME/gcp-sa-key.json"
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "Deploying uploadPhotoToDrive using FIREBASE_TOKEN..."
            npx firebase-tools deploy --only functions:uploadPhotoToDrive --project soe-visit-test --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "::warning::Firebase Functions deployment skipped because FIREBASE_SERVICE_ACCOUNT_SOE_VISIT_TEST or FIREBASE_TOKEN is not configured in GitHub Secrets."
            echo "NOTICE: APK built successfully! To enable automatic Firebase Cloud Functions deployment, add FIREBASE_SERVICE_ACCOUNT_SOE_VISIT_TEST or FIREBASE_TOKEN to your GitHub Repository Secrets."
          fi

      - name: Cleanup Keystore
        if: always()
        run: |
          rm -f "${{ github.workspace }}/SOE-release.jks"
          rm -f "SOE-release.jks"
