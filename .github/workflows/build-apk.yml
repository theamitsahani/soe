name: Build and Sign Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    env:
      ACTIONS_RUNNER_FORCE_NODE24: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Environment
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Production signing secrets are missing! Please configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD in GitHub Repository Secrets to build signed release APKs."
            exit 1
          fi

          KEYSTORE_FILE="${{ github.workspace }}/SOE-release.jks"
          echo "Decoding KEYSTORE_BASE64 from GitHub Secrets..."
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          echo "Keystore successfully prepared at $KEYSTORE_FILE"

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/SOE-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          GRADLE_CMD="./gradlew"
          if [ ! -f "./gradlew" ]; then
            GRADLE_CMD="gradle"
          fi
          echo "Running Gradle build command: $GRADLE_CMD :app:assembleRelease"
          $GRADLE_CMD :app:assembleRelease --stacktrace --no-daemon -Dorg.gradle.configuration-cache=false -Dksp.incremental=false

      - name: Verify APK Signature
        run: |
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$RELEASE_APK" ] || [ ! -f "$RELEASE_APK" ]; then
            echo "Release APK search in app/build/outputs/apk/release..."
            ls -la app/build/outputs/apk/release/ || true
            RELEASE_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          
          if [ -z "$RELEASE_APK" ] || [ ! -f "$RELEASE_APK" ]; then
            echo "ERROR: No APK found after build!"
            exit 1
          fi
          
          echo "Found APK: $RELEASE_APK"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            echo "Verifying APK with $APKSIGNER..."
            $APKSIGNER verify --verbose "$RELEASE_APK" || true
          fi

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SOE-release-signed-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Cleanup Keystore
        if: always()
        run: |
          rm -f "${{ github.workspace }}/SOE-release.jks"
          rm -f "SOE-release.jks"
