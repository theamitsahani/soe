name: Deploy Firebase Rules

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "firebase.json"
  workflow_dispatch:

jobs:
  deploy-rules:
    name: Deploy Firestore & Storage Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Verify Service Account Secret
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is missing! Generate a service account JSON key from Firebase Console > Project Settings > Service Accounts, and add its full content under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Write Service Account Key to File
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$HOME/gcp-key.json"

      - name: Deploy Firestore Rules & Indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/gcp-key.json
        run: |
          firebase deploy \
            --only firestore:rules,firestore:indexes \
            --project soe-visit-test \
            --non-interactive

      - name: Deploy Storage Rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/gcp-key.json
        run: |
          firebase deploy \
            --only storage \
            --project soe-visit-test \
            --non-interactive

      - name: Cleanup Service Account Key
        if: always()
        run: rm -f "$HOME/gcp-key.json"
