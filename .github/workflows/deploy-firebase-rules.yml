name: Firebase Rules Deploy

on:
  push:
    branches:
      - main
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-deploy.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-firebase:
    name: Validate & Deploy Firebase Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Verify Firebase CLI
        run: firebase --version

      - name: Verify Firebase configuration
        run: |
          test -f firebase.json
          test -f .firebaserc

          echo "Firebase configuration found."

      - name: Show Firebase project
        run: |
          echo "Configured Firebase project:"
          cat .firebaserc

      - name: Deploy Firestore Rules
        if: hashFiles('firestore.rules') != ''
        run: |
          echo "Deploying Firestore Security Rules..."
          firebase deploy --only firestore:rules --non-interactive

      - name: Deploy Storage Rules
        if: hashFiles('storage.rules') != ''
        run: |
          echo "Deploying Firebase Storage Security Rules..."
          firebase deploy --only storage --non-interactive

      - name: Deployment successful
        run: |
          echo "======================================"
          echo "Firebase Rules Deployment Successful"
          echo "======================================"
          echo "Firestore rules: deployed if configured"
          echo "Storage rules: deployed if configured"
          echo "Commit: $GITHUB_SHA"
